{% extends "base.html" %}
{% block title %}Edit student{% endblock %}
{% block content %}
<h1>Edit student</h1>
<section class="card">
  <form method="post" class="form-row">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Roll number<input name="roll_no" maxlength="20" value="{{ student.roll_no }}" required></label>
    <label>Name<input name="name" maxlength="100" value="{{ student.name }}" required></label>
    <label>Section<input name="section" maxlength="10" value="{{ student.section }}" required></label>
    <button class="btn">Save changes</button>
    <a class="btn secondary" href="{{ url_for('web.students') }}">Cancel</a>
  </form>
</section>
{% endblock %}

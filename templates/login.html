{% extends "base.html" %}
{% block title %}Teacher login{% endblock %}
{% block content %}
<div class="login-box card">
  <h1>Teacher login</h1>
  <p class="muted">Student Performance Analysis System</p>
  <form method="post" action="{{ url_for('login') }}" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username
      <input name="username" maxlength="50" required autofocus autocomplete="username">
    </label>
    <label>Password
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button class="btn">Log in</button>
  </form>
</div>
{% endblock %}
